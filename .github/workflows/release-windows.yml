name: Release Windows portable EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend
        run: npm run check --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend -- --run

      - name: Set China Standard Time
        run: tzutil /s 'China Standard Time'

      - name: Test Go backend
        run: go test ./... -count=1

      - name: Vet Go backend
        run: go vet ./...

      - name: Build portable Windows EXE
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -platform windows/amd64 -o openai-register-portable-windows-amd64.exe

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ inputs.tag }}'
          $exe = 'build/bin/openai-register-portable-windows-amd64.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Release executable was not produced: $exe"
          }
          $sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = @(
            '首个公开发布版：Go + Wails + Svelte 重构后的便携式 Windows x64 应用。'
            ''
            '- 无需安装，下载 EXE 后直接运行'
            '- 程序数据默认保存到 `%APPDATA%\OpenAIRegister`'
            '- 发布资产由 GitHub Actions 从公开 `main` 源码构建并通过前端检查、前后端测试及 `go vet`'
            "- 文件大小：$size 字节"
            "- SHA-256：`$sha256`"
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag $exe --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release asset' }
            & gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "$tag · Windows 便携版" --notes-file $notesPath --latest
          } else {
            & gh release create $tag $exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$tag · Windows 便携版" --notes-file $notesPath --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish GitHub Release' }
